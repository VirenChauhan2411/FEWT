<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let n = parseInt(prompt("Enter the size of array : "));
      let arr = [];
      temp = arr[0];
      for (let i = 0; i < n; i++) {
        arr[i] = parseInt(prompt("Enter the elements : "));
      }

      for (let i = 0; i < n; i++) {
        for (let j = i; j < n; j++) {
          if (arr[i] > arr[j]) {
            temp = arr[j];
            arr[j] = arr[i];
            arr[i] = temp;
          }
        }
      }
      document.write(arr);
    </script>
  </body>
</html>
