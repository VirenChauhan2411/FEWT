<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let n1 = parseInt(prompt("Enter number of starting :"));
      let n2 = parseInt(prompt("Enter number of ending :"));
      for (i = n1; i <= n2; i++) {
                let count = 0;

        for (j = 1; j <= i; j++) {
          if (i % j == 0) {
            count++
          }
        }
        if (count==2) {
          document.write("</br>" + i);
        }
      }
    </script>
  </body>
</html>
