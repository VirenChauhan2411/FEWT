<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let n = parseInt(prompt("Enter number :"));
        let k = 1;
      let ld = n % 10;
      let fd = parseInt(n / 10);

      for (let i = 1; i <= ld; i++) {
         k = k * fd;
      }
      alert(k);
    </script>
  </body>
</html>
