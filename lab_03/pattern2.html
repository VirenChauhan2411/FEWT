<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let n = parseInt(prompt("Enter number of rows :"));
      for (i = 0; i < n; i++) {
        for (j = n - i; j >= 1; j--) {
          document.write(j);
        }
        document.write("</br>");
      }
    </script>
  </body>
</html>
