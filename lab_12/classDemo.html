<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a class</title>
</head>

<body>
    <script>
        class Student {
            constructor(name, rollNo) {
                this.name = name;
                this.rollNo = rollNo;
            }

            display() {
                console.log("Name: " + this.name);
                console.log("Roll No: " + this.rollNo);
            }
        }

        
        let s1 = new Student(
            "Viren", 
            101
        );
        let s2 = new Student(
            "Chauhan", 
            102
        );
        let s3 = new Student(
            "DU", 
            101
        );

        
        s1.display();
        s2.display();
        s3.display();
    </script>
</body>

</html>
