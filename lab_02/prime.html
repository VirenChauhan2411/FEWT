<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let a;
      let n1 = parseInt(prompt("Enter the number :"));
      for (i = 1; i < n1; i++) {
        if (n1 % i == 0) {
          a++;
        }
      }
      if (a != 0) {
        alert("Congratulations Number is prime :");
      } else {
        alert("Number is not prime");
      }
    </script>
  </body>
</html>
