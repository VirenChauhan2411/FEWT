<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let n1 = parseInt(prompt("Enter the number :"));
      let a = 1;
      for (i = n1; i > 0; i--) {
        a *= i;
      }
      alert("Factorial of number is " + a);
    </script>
  </body>
</html>
