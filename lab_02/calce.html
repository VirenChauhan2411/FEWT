<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n1 = parseInt(prompt("Enter number 1 :"))
        let op =  (prompt("the operation which(+,-,*,/)"))
        let n2 = parseInt(prompt("Enter number 2 :"))
        
        let ans
        if(op == '+')
    {
        ans = n1 + n2
    }
    else if(op == '-')
    {
        ans = n1 - n2
    }
    else if(op == '*')
    {
        ans = n1 * n2
    }
    else if(op == '/')
    {
        ans = n1 / n2
    }
    else 
    {
        alert("INvelid input")
    }
    alert(ans)
            
        
    </script>
</body>
</html>
