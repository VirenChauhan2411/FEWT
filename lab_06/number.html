<html lang="en">
  <head>

    <title>Document</title>

  <body>
    <script>
      document.write(Math.max(1, 2, 3, 4, 5) + "</br>");
      document.write(Math.min(1, 2, 3, 4, 5) + "</br>");
      document.write(Math.abs(-50) + "</br>");
      document.write("===============================================================================</br>",);

      document.write(Math.floor(Math.random() * 6 + 1) + "</br>");

      document.write("===============================================================================</br>");

      document.write(Math.floor(25.5) + "</br>");
      document.write(Math.ceil(25.212) + "</br>");
      document.write(Math.round(26.5) + "</br>");
      document.write(Math.trunc(25.16541351) + "</br>");

    document.write("===============================================================================</br>");
      

    </script>
  </body>
