<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let d = new Date();
      months = ["January","February","March","April","May","June","July", "August","September","October","November","December",];
      days = ["sunday","monday","tuesday","Wednesday","thurssday","friday","saturday",];
      
      document.write(d + "</br>");
      document.write(d.getTime() + "</br>");
      document.write(d.getFullYear() + "</br>");
      document.write(months[d.getMonth()] + "</br>");
      document.write(days[d.getDay()] + "</br>");
    </script>
  </body>
</html>
